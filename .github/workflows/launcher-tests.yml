name: launcher tests

on:
  push:
    paths: ["launcher/**", "tools/installer/**", ".github/workflows/launcher-tests.yml"]
  pull_request:
    paths: ["launcher/**", "tools/installer/**", ".github/workflows/launcher-tests.yml"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the launcher imports rt / zone modules; the page tests need FastAPI's TestClient (httpx)
      - run: python -m pip install pytest numpy opencv-python-headless onnxruntime psutil pyserial fastapi httpx
      - run: python -m pytest launcher -v
