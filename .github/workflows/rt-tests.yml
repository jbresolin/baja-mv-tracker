name: rt tests

on:
  push:
    paths: ["rt/**", ".github/workflows/rt-tests.yml"]
  pull_request:
    paths: ["rt/**", ".github/workflows/rt-tests.yml"]

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: python -m pip install -r rt/requirements-test.txt
      - run: python -m pytest rt/tests -v -rs
