name: zone tests

on:
  push:
    paths: ["zone/**", "rt/**", ".github/workflows/zone-tests.yml"]
  pull_request:
    paths: ["zone/**", "rt/**", ".github/workflows/zone-tests.yml"]

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # WP-Z1 (zone/ptz, characterize) is stdlib-only; WP-Z2 (tracker, page) needs numpy / OpenCV / FastAPI.
      # ffmpeg is optional: the replay and detection-check tests skip without it.
      - run: python -m pip install pytest numpy opencv-python-headless fastapi httpx
      - run: python -m pytest zone -v
