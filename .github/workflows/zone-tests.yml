name: zone tests

on:
  push:
    paths: ["zone/**", ".github/workflows/zone-tests.yml"]
  pull_request:
    paths: ["zone/**", ".github/workflows/zone-tests.yml"]

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # zone/ is stdlib-only; pytest is the only thing the tests need.
      - run: python -m pip install pytest
      - run: python -m pytest zone -v
