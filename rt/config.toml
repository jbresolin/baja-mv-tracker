# rt/config.toml: settings of the real-time lap-pass prototype (rt/run.py). Relative paths are relative to the
# repo root (the folder that contains rt/). Any key can be overridden on the command line: --set section.key=value
# Defaults are sized for the worst-case laptop (4-core 8th-gen Intel U-series, 8 GB RAM, Intel UHD 620 iGPU).

[models]
# One-line switch to the published models: manifest = "deploy/models/manifest.json" (its roles override the paths
# below; see rt/README.md for the format). Empty = use the paths below.
manifest = "deploy/models/manifest.json"   # final models (all 5 events), validated on 26SE
manifest_car = "car_n"          # with a manifest: "car_n" (YOLO11n, default) or "car_s" (YOLO11s)
car_detector = "students/runs/bench/cars_n640_v2_best/384x640/best.onnx"
car_detector_alt = "students/runs/bench/cars_s640_best/384x640/best.onnx"  # YOLO11s (~3x the CPU): bench_laptop.py only
car_imgsz = [384, 640]          # (h, w); a fixed-shape export overrides it
panel_detector = "students/runs/bench/num_n320_r2_best/320dyn/best.onnx"  # dynamic-shape export (minimum rectangle)
panel_imgsz = 320
recognizer = "students/runs/recog/pq_spl_full/recog.onnx"
vote = "students/runs/recog/pq_spl_full/eval/panel_tau.json"   # tau / min_support / score picked on 25SU val (WP10b)

[runtime]
# Inference backend per model: "onnxruntime" (CPU) or "openvino" (device CPU, GPU = Intel iGPU, AUTO). OpenVINO
# falls back to ONNX Runtime CPU with a warning if it or the device is missing. Measure first: rt/bench_laptop.py
car_backend = "onnxruntime"
car_device = "CPU"
id_backend = "onnxruntime"      # panel detector + recognizer
id_device = "CPU"
threads_detector = 2            # intra-op threads of the car detector (--threads N sets both). 2, not 1: on the worst-case
                                # laptop (~2x slower per core when throttled) one thread would need ~110 ms per 100 ms frame
threads_identity = 1            # intra-op threads of the panel detector and the recognizer (identity worker)
cv2_threads = 1                 # OpenCV's own thread pool (resize / letterbox)
ort_spinning = false            # false: idle ONNX Runtime threads sleep instead of busy-waiting (saves a laptop core)
affinity = []                   # optional CPU list for this process and ffmpeg, e.g. [0, 2] (needs psutil)
affinity_decoder = true         # also pin the ffmpeg decoder to that list
priority = "normal"             # "normal" | "high" (Windows: above-normal priority for the race-day process)

[capture]
fps = 10.0                      # detection / tracking rate (WP9: tracking at 10 fps, min 6 frames per track)
max_width = 1920                # downscale wider sources (4K) to this width at decode; 0 = native
ffmpeg = "ffmpeg"
ffprobe = "ffprobe"
decode_threads = 0              # ffmpeg -threads for decoding (0 = ffmpeg's default)
hwaccel = "none"                # ffmpeg -hwaccel for files/streams: none | d3d11va | qsv | dxva2 | auto (Intel laptop: try d3d11va;
                                # decode of 1080p30 H.264 costs ~0.6 core on this 3900X in software)
queue_size = 4                  # frames between capture and detection; live sources drop frames when it is full
live_latency_s = 0.0            # known capture latency of a live source (subtracted from the frame time)

[camera]                        # USB camera (--source camera, or a camera index); rt/livecam.py + rt/camsource.py
backend = "auto"                # auto (= dshow on Windows, v4l2 on Linux) | dshow | msmf | v4l2
device = 0                      # index, or (better) the device path: `python rt/run.py --list-cameras` prints it
width = 1920
height = 1080
fps = 30
fourcc = "MJPG"                 # set explicitly: without it DirectShow often falls back to YUY2 at 5 fps for 1080p
require_fourcc = true           # fail (and retry) if the camera does not deliver this FOURCC
raw_mjpeg = false               # ask for the camera's JPEG bytes (CONVERT_RGB = 0). DirectShow ignores it for MJPG (it
                                # always decodes); V4L2 honours it. rt checks the first frame and falls back to images.
read_mode = "auto"              # auto: from the backend (dshow -> retrieve_every_frame, v4l2 -> grab_then_retrieve);
                                # see rt/camsource.py. retrieve_every_frame is always correct; grab_then_retrieve
                                # busy-loops on a backend whose grab() does not wait (DirectShow).
lost_after_s = 3.0              # no good frame for this long (monotonic clock) = camera lost -> status "lost", reopen
lost_after_failures = 10        # ... or this many failed reads in a row
reopen_first_s = 1              # reopen backoff: 1 s, doubling ...
reopen_max_s = 30               # ... up to 30 s
clock_map_every_s = 60          # a `clock_map` event (wall vs monotonic time of a grab) this often
[camera.settings]               # applied at every open, then read back and logged; empty = leave the camera as it is
                                # (see rt/configs/lapline.example.toml for the image settings)

[recording]                     # rt/recorder.py: live camera only; files go to <folder of --out>/rec/
mode = "h264"                   # h264 (~4 GB/h at 10 fps with x264 CRF 23) | off. "mjpeg" (copy) is refused: DirectShow
                                # gives rt decoded frames, so there are no camera JPEGs to copy
segment_min = 30                # a new file every 30 minutes (and after a camera loss or a gap in the frames)
split_gap_periods = 2           # a gap of more than 2 frame periods (0.2 s at 10 fps) between frames starts a new file
warn_free_gb = 20               # status page warning under this much free disk
stop_free_gb = 5                # stop recording (never detection) under this; resumes above warn_free_gb
disk_check_s = 10
queue_frames = 10               # frames waiting for the writer (1 s at 10 fps; a 1080p frame is ~6 MB); when full the
                                # oldest is dropped from the recording (counted)
csv_flush_rows = 30             # flush the .frames.csv every this many rows
write_timeout_s = 10            # ffmpeg not accepting a frame for this long = recording failed: kill it, new file
retry_wait_s = 10               # wait before a new file after a failure
max_failures = 5                # failures in a row before recording gives up for the run (detection goes on)
h264_encoders = ["h264_qsv", "h264_amf", "libx264"]   # probed in this order at start; the one used is logged
subdir = "rec"

[status]                        # rt/status.py: read-only page, http://<laptop>:<port>/
enabled = true
bind = "0.0.0.0"                # all interfaces: a phone on the LAN can open it (allow Python in the Windows firewall)
port = 8765
passes = 20                     # last passes shown
thumb_width = 320
thumb_fps = 5                   # thumbnails kept per second for the pass list
thumb_ring_s = 20               # seconds of thumbnails kept (a pass's thumbnail is the frame nearest its t_cross)
fps_window_s = 10
time_check_s = 60               # re-measure the clock offset this often
required = false                # true: exit (code 3) if the port is busy. The launcher always asks for this
                                # (--require-status), since it watches rt through the page

[launch]                        # rt/supervise.py (rt\run_lapline.bat): one unattended rt
name = "lapline"
event = ""                      # roster code, e.g. "27SE" (required)
source = "camera"
out_dir = "out/lapline"         # each run: <out_dir>/<date>/lapline_<time>.jsonl (+ rec/); launcher.log here
extra_args = []                 # more rt/run.py arguments, e.g. ["--stats", "--quiet"]
restart_first_s = 5             # restart backoff: 5 s, doubling ...
restart_max_s = 60              # ... up to 60 s
healthy_reset_min = 10          # a run that lasted this long resets the backoff to restart_first_s
stall_s = 30                    # no status answer, or fps = 0 while the camera says streaming, this long -> kill + restart
startup_grace_s = 60            # no stall check during the first seconds of a run
camera_recover_max_s = 600      # camera lost / reopening this long in one go -> restart rt anyway
camera_attempt_stall_s = 60     # camera lost and rt's open-attempt counter not moving this long -> restart rt
poll_s = 2

[clock]
# Frame time = wall clock of the video PC. Files: "auto" = OBS clock overlay (26SE) if present, else the container
# creation_time tag, else file mtime - duration. Live: the system clock (time sync is checked at start).
mode = "auto"                   # auto | overlay | creation | mtime | pts | system
offset_s = 0.0                  # added to every frame time (manual correction of a known clock error)
video_minus_server_s = 0.0      # this PC's clock minus the lap server's (26SE: +80); LapAppSink subtracts it
warn_sync_age_h = 24.0          # warn if Windows time sync is older than this
ntp_server = ""                 # optional SNTP offset check at start (e.g. "pool.ntp.org"); empty = no network

[detection]
conf = 0.15                     # = students/eval_26se.py TRACK_CONF
nms_iou = 0.7

[tracker]                       # = ultralytics bytetrack.yaml (the offline evaluation's tracker)
track_high_thresh = 0.25
track_low_thresh = 0.1
new_track_thresh = 0.25
track_buffer = 30               # frames (ultralytics does not scale it with fps: 3 s at 10 fps)
match_thresh = 0.8
fuse_score = true

[passes]                        # = lapvision/passes.py (session 1; never tuned on 26SE)
fg_h = 0.20                     # foreground track: max box height > fg_h * H ...
fg_y2 = 0.40                    # ... and max box bottom > fg_y2 * H ...
min_frames = 6                  # ... and >= 6 reported frames (0.6 s at 10 fps, as evaluated by WP9)
edge = 0.02
merge_gap_s = 3.0               # rule (a): car still in view reappears nearby within 3 s
static_gap_s = 10.0             # rule (b): a track restarting where the last box ended (IoU > 0.2) within 10 s
nested_ratio = 0.6              # nested duplicate boxes: median intersection / smaller area > 0.6
recent_passes = 4
pending_max_s = 10.0            # a pass waits for a not-yet-foreground track that started inside its window, at most this long

[identity]
max_crops = 30                  # crops read per pass (passes.pick_crops: large + sharp + spread in time)
crop_pad = 0.05
crop_min_h = 0.10               # keep crop candidates only for boxes taller than this share of the frame
candidates_per_track = 48       # bounded candidate buffer per track (thinned in time when full)
crop_jpeg = 92                  # store candidates JPEG-encoded at this quality (bounded RAM; the offline crops were q92); 0 = raw
panel_conf = 0.1                # picked on 25SU val (WP9)
panel_pad = 0.05
panel_rect = true               # minimum-rectangle letterbox (= ultralytics .pt predict); needs the dynamic export
provisional = true              # read a few crops while the car is in view (PTZ entry camera)
provisional_every_s = 0.5
provisional_batch = 4
provisional_max_reads = 16
queue_max = 64                  # identity jobs waiting; provisional jobs are dropped first when it is full

[output]
csv = ""                        # passes CSV; default: <--out>.csv
crops_dir = ""                  # optional: save each pass's selected crops here (review / future training data)

[lapapp]                        # stub only (rt/sinks.py LapAppSink): writes the rows it would insert, no network/DB
enabled = false
fonte_id = 5                    # a new contagem_fonte row for the camera (26SE has 1-3 human, 4 box)
dispositivo_id = 0
only_numbered = true            # contagem_passagem.equipe_numero is NOT NULL in every 26SE row
outbox = ""                     # JSONL file of the would-be rows; default: <--out>.lapapp.jsonl

[beam]                          # rt/beam/: timing light-beam sensor through a USB serial adapter (WP-L2). Shadow mode only
driver = "off"                  # off | modem-line | byte-stream | fake (scripted cars, dry run without hardware)
port = "COM5"                   # serial port of the adapter (python -m rt.tools.beam_probe --list shows them)
line = "cts"                    # modem-line: cts | dsr | cd (= dcd) | ri
active = "high"                 # modem-line: which line state means "beam blocked": high = asserted, low = not asserted
poll_hz = 1000                  # modem-line: polls per second (the time stamp is within 1/poll_hz of the real edge)
set_dtr = true                  # modem-line: drive the adapter's DTR / RTS outputs high (can power a pull-up / sensor)
set_rts = true
baud = 9600                     # byte-stream (and the port open): serial speed
byte_pattern = ""               # byte-stream: hex bytes that mean "pulse/blocked" ("" = any received bytes = one edge)
byte_release_pattern = ""       # byte-stream: hex bytes that mean "clear" ("" = pulses only)
read_timeout_s = 0.002          # byte-stream: longest wait for a byte per read
group_gap_s = 0.25              # edges closer than this belong to the same car (tube frames give several pulses)
stuck_s = 5.0                   # a break longer than this is not a car: beam_stuck, no breaks until it clears
reopen_first_s = 1              # port missing / unplugged: retry after 1 s, doubling ...
reopen_max_s = 30               # ... up to 30 s
max_edge_events_per_s = 100     # beam_edge lines written per second at most (a noisy line still groups, counted)
poll_report_s = 60              # beam_poll event (achieved poll rate and jitter) this often
assoc_window_s = 1.0            # live: a pass_end gets t_beam if exactly one break is within this of its t_cross
assoc_offset_s = 0.0            # live: expected t_cross - t_beam (camera centre line vs beam); fuse_beam.py measures it
led_roi = []                    # [x, y, w, h] pixels of the processed frame: LED in view -> camera_latency; [] = off
led_threshold = 128             # mean brightness (0-255) above which the LED counts as on
led_max_latency_s = 0.5         # an LED frame is paired with an active beam edge at most this much earlier
fake_every_s = 20.0             # fake driver: one synthetic car every this many seconds ...
fake_pulses = 3                 # ... blocking the beam this many times
