<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA review</title>
<style>
  :root { --bg:#16181b; --panel:#202328; --line:#33373e; --fg:#e6e8eb; --dim:#8c939d;
          --ok:#3fb950; --bad:#f85149; --warn:#d29922; --info:#58a6ff; --box:#ffea00; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
               font:14px/1.35 system-ui, "Segoe UI", sans-serif; overflow:hidden; }
  #app { display:flex; flex-direction:column; height:100vh; }
  header { display:flex; gap:18px; align-items:center; padding:6px 12px; background:var(--panel);
           border-bottom:1px solid var(--line); white-space:nowrap; overflow:hidden; }
  header .name { color:var(--dim); overflow:hidden; text-overflow:ellipsis; max-width:22vw; }
  .bar { width:140px; height:8px; background:var(--line); border-radius:4px; overflow:hidden; display:inline-block;
         vertical-align:middle; margin-left:6px; }
  .bar > i { display:block; height:100%; background:var(--info); width:0; }
  .stat b { font-variant-numeric:tabular-nums; }
  main { flex:1; display:flex; min-height:0; }
  aside { width:270px; flex:none; padding:12px; background:var(--panel); border-right:1px solid var(--line);
          display:flex; flex-direction:column; gap:10px; overflow-y:auto; }
  #num { font-size:88px; font-weight:700; line-height:1; letter-spacing:-2px; font-variant-numeric:tabular-nums; }
  #num.none { font-size:34px; color:var(--dim); letter-spacing:0; padding:20px 0; }
  #team { font-size:17px; font-weight:600; }
  #team.warn { color:var(--bad); }
  .share { height:10px; background:var(--line); border-radius:5px; overflow:hidden; }
  .share > i { display:block; height:100%; background:var(--ok); }
  .kv { color:var(--dim); font-size:13px; overflow-wrap:anywhere; }
  .kv b { color:var(--fg); font-weight:500; }
  #overlay.mismatch { color:var(--warn); font-weight:600; }
  #ctx img { width:100%; max-height:150px; object-fit:contain; background:#0e0f11; border-radius:4px; display:block; cursor:zoom-in; }
  #prev { padding:6px 8px; border-radius:4px; background:#2d333b; display:none; }
  #flags { display:flex; gap:6px; flex-wrap:wrap; }
  .flag { padding:2px 7px; border-radius:10px; border:1px solid var(--line); color:var(--dim); font-size:12px; }
  .flag.on { border-color:var(--warn); color:var(--warn); background:#3a2e12; }
  #wrongbox { display:none; padding:8px; border:1px solid var(--bad); border-radius:6px; }
  #wrongbox input { width:100%; font-size:28px; padding:4px 8px; background:var(--bg); color:var(--fg);
                    border:1px solid var(--line); border-radius:4px; font-variant-numeric:tabular-nums; }
  #wrongteam { font-size:13px; color:var(--dim); margin-top:4px; min-height:1.3em; }
  footer { display:flex; flex-wrap:wrap; gap:4px 18px; padding:5px 12px; background:var(--panel);
           border-top:1px solid var(--line); font-size:12.5px; color:var(--dim); }
  footer [data-k] { cursor:pointer; padding:4px 2px; user-select:none; }
  kbd { display:inline-block; min-width:22px; text-align:center; padding:1px 5px; border:1px solid #555;
        border-bottom-width:2px; border-radius:4px; color:var(--fg); background:#2a2e34; font:12px ui-monospace, monospace; }
  #grid { flex:1; display:grid; gap:6px; padding:6px; min-width:0; min-height:0; align-content:center; justify-content:center; }
  .cell { display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:0; min-height:0;
          background:#0e0f11; border-radius:4px; overflow:hidden; position:relative; }
  .wrap { position:relative; display:inline-block; line-height:0; cursor:zoom-in; }
  .wrap img { display:block; }
  .nb { position:absolute; border:2px solid var(--box); box-shadow:0 0 0 1px #000; pointer-events:none; }
  .read { position:absolute; left:4px; top:4px; font:600 12px ui-monospace, monospace; padding:1px 5px;
          border-radius:3px; background:rgba(0,0,0,.65); color:var(--dim); }
  .read.hit { color:var(--ok); } .read.other { color:var(--warn); }
  #flash { position:fixed; inset:0; pointer-events:none; border:6px solid transparent; transition:border-color .25s; }
  #zoom { position:fixed; inset:0; background:rgba(0,0,0,.92); display:none; align-items:center; justify-content:center; z-index:5; }
  #zoom .wrap { cursor:zoom-out; }
  #msg { position:fixed; bottom:10px; left:50%; transform:translateX(-50%); padding:6px 14px; border-radius:6px;
         background:var(--bad); color:#fff; display:none; z-index:6; }
  #done { display:none; margin:auto; text-align:center; font-size:18px; line-height:1.7; }
  #done code { background:var(--panel); padding:2px 6px; border-radius:4px; font-size:14px; }
  @media (max-width: 1100px) { aside { width:220px; } #num { font-size:68px; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="name" id="bname">loading…</span>
    <span class="stat">reviewed <b id="prog">0/0</b><span class="bar"><i id="progbar"></i></span></span>
    <span class="stat" title="correct / (correct + wrong) over items with a proposed number, Wilson 95%">precision <b id="prec">–</b></span>
    <span class="stat" title="items with a proposed number / items judged to be cars">coverage <b id="cov">–</b></span>
    <span class="stat">not car <b id="nc">0</b> · unsure <b id="un">0</b></span>
    <span class="stat" title="median time per item × items left">ETA <b id="eta">–</b></span>
  </header>
  <main>
    <aside id="side">
      <div class="kv" id="where"></div>
      <div id="num">–</div>
      <div id="team"></div>
      <div><div class="share"><i id="sharebar"></i></div><div class="kv" id="votes"></div></div>
      <div class="kv" id="overlay"></div>
      <div id="flags"></div>
      <div id="prev"></div>
      <div id="wrongbox">
        <div class="kv">right number (Enter = save, empty = unknown, Esc = cancel)</div>
        <input id="wrongnum" inputmode="numeric" autocomplete="off">
        <div id="wrongteam"></div>
      </div>
      <div id="ctx"></div>
      <div class="kv" id="meta"></div>
    </aside>
    <section id="grid"></section>
    <div id="done"></div>
  </main>
  <footer id="keys">
    <span data-k="1"><kbd>1</kbd> <span id="k1">correct</span></span>
    <span data-k="2"><kbd>2</kbd> <span id="k2">wrong number (type it)</span></span>
    <span data-k="3"><kbd>3</kbd> not a car / bad box</span>
    <span data-k="4"><kbd>4</kbd> can't tell</span>
    <span data-k="b"><kbd>B</kbd> number boxes wrong</span>
    <span data-k="r"><kbd>R</kbd> per-crop reads</span>
    <span data-k="Backspace"><kbd>&#9003;</kbd> undo / previous</span>
    <span><kbd>click</kbd> zoom</span>
  </footer>
</div>
<div id="zoom"></div>
<div id="flash"></div>
<div id="msg"></div>
<script>
"use strict";
const $ = id => document.getElementById(id);
let B = null;              // batch from the server
let items = [], verdicts = {}, history = [];
let cur = -1, shownAt = 0, boxesWrong = false, wrongMode = false, showReads = true;
const queue = []; let sending = false;

function wilson(k, n) {
  if (!n) return null;
  const z = 1.96, p = k / n, d = 1 + z*z/n;
  const c = (p + z*z/(2*n)) / d, h = z * Math.sqrt(p*(1-p)/n + z*z/(4*n*n)) / d;
  return [p, Math.max(0, c-h), Math.min(1, c+h)];
}
const pct = x => (100*x).toFixed(0);
const has = v => v !== null && v !== undefined && v !== "";
const team = (ev, n) => has(n) ? (B.rosters[ev] || {})[String(n)] : undefined;
const imgurl = p => "/img/" + p.split("/").map(encodeURIComponent).join("/");

function stats() {
  let c = 0, w = 0, nc = 0, un = 0, prop = 0, cars = 0;
  for (const it of items) {
    const v = verdicts[it.item_id]; if (!v) continue;
    if (v.verdict === "not_car") { nc++; continue; }
    if (v.verdict === "unsure") un++;
    cars++;
    if (has(it.proposed_number)) { prop++; if (v.verdict === "correct") c++; else if (v.verdict === "wrong") w++; }
  }
  return {c, w, nc, un, prop, cars};
}

function renderHeader() {
  const n = items.length, r = Object.keys(verdicts).length, s = stats();
  $("prog").textContent = r + "/" + n;
  $("progbar").style.width = (n ? 100*r/n : 0) + "%";
  const p = wilson(s.c, s.c + s.w);
  $("prec").textContent = p ? `${pct(p[0])}% [${pct(p[1])}–${pct(p[2])}] n=${s.c+s.w}` : "–";
  $("cov").textContent = s.cars ? pct(s.prop/s.cars) + "%" : "–";
  $("nc").textContent = s.nc; $("un").textContent = s.un;
  const dts = Object.values(verdicts).map(v => v.dt_ms).filter(x => x > 0 && x < 120000).sort((a,b) => a-b);
  if (dts.length >= 3) {
    const med = dts[Math.floor(dts.length/2)], left = (n - r) * med / 1000;
    $("eta").textContent = `${Math.round(left/60)} min (${(med/1000).toFixed(1)} s/item)`;
  }
}

function nextUnreviewed(from) {
  for (let k = 0; k < items.length; k++) {
    const i = (from + k) % items.length;
    if (!verdicts[items[i].item_id]) return i;
  }
  return -1;
}

function layoutGrid() {
  const g = $("grid"), cells = g.children.length; if (!cells) return;
  const W = g.clientWidth - 12, H = g.clientHeight - 12, gap = 6, asp = 1.2;
  let best = 1, bestS = 0;
  for (let cols = 1; cols <= cells; cols++) {
    const rows = Math.ceil(cells / cols);
    const cw = (W - gap*(cols-1)) / cols, ch = (H - gap*(rows-1)) / rows;
    const s = Math.min(cw, ch * asp);
    if (s > bestS) { bestS = s; best = cols; }
  }
  const rows = Math.ceil(cells / best);
  const cw = Math.floor((W - gap*(best-1)) / best), ch = Math.floor((H - gap*(rows-1)) / rows);
  g.style.gridTemplateColumns = `repeat(${best}, ${cw}px)`;
  g.style.gridTemplateRows = `repeat(${rows}, ${ch}px)`;
  for (const img of g.querySelectorAll("img")) { img.style.maxWidth = cw + "px"; img.style.maxHeight = ch + "px"; }
}

function boxedImage(src, boxes, big) {
  const wrap = document.createElement("div"); wrap.className = "wrap";
  const img = new Image(); img.src = src; img.alt = "";
  if (big) { img.style.maxWidth = "96vw"; img.style.maxHeight = "94vh"; img.style.minHeight = "50vh"; img.style.objectFit = "contain"; }
  wrap.appendChild(img);
  if (boxes && boxes.length) {
    img.addEventListener("load", () => {
      const W = img.naturalWidth, H = img.naturalHeight;
      for (const b of boxes) {
        const d = document.createElement("div"); d.className = "nb";
        d.style.left = (100*b[0]/W) + "%"; d.style.top = (100*b[1]/H) + "%";
        d.style.width = (100*(b[2]-b[0])/W) + "%"; d.style.height = (100*(b[3]-b[1])/H) + "%";
        wrap.appendChild(d);
      }
    });
  }
  return wrap;
}

function zoom(src, boxes) {
  const z = $("zoom"); z.innerHTML = ""; z.appendChild(boxedImage(src, boxes, true)); z.style.display = "flex";
}
function unzoom() { $("zoom").style.display = "none"; $("zoom").innerHTML = ""; }

function readClass(raw, prop) {
  const m = String(raw || "").match(/\d+/);
  if (!m) return "";
  return has(prop) && Number(m[0]) === Number(prop) ? "hit" : "other";
}

function showItem(i) {
  cur = i; boxesWrong = false; setWrongMode(false); unzoom();
  if (i < 0) return showDone();
  $("done").style.display = "none"; $("grid").style.display = "grid"; $("side").style.display = "flex";
  const it = items[i], v = verdicts[it.item_id];
  const pos = items.indexOf(it) + 1;
  $("where").innerHTML = `<b>${it.event}</b> · ${it.shot_tag || "?"} · item ${pos}/${items.length}<br>${it.video_id} · ${it.track_key}`;
  const pn = it.proposed_number;
  $("num").textContent = has(pn) ? "#" + pn : "no read";
  $("num").className = has(pn) ? "" : "none";
  const tn = team(it.event, pn);
  $("team").textContent = has(pn) ? (tn || "not in roster!") : "";
  $("team").className = has(pn) && !tn ? "warn" : "";
  const sh = it.vote_share || 0;
  $("sharebar").style.width = pct(sh) + "%";
  $("sharebar").style.background = sh >= 0.5 ? "var(--ok)" : sh >= 0.3 ? "var(--warn)" : "var(--bad)";
  $("votes").innerHTML = `share <b>${sh.toFixed(2)}</b> · votes <b>${it.n_votes ?? "–"}</b>` +
    (has(it.n_crops) ? ` of <b>${it.n_crops}</b> crops` : "");
  const on = it.overlay_number;
  if (has(on)) {
    $("overlay").innerHTML = `overlay <b>#${on}</b> ${team(it.event, on) || ""}` + (has(pn) && Number(on) !== Number(pn) ? " ≠ proposed" : "");
    $("overlay").className = "kv" + (has(pn) && Number(on) !== Number(pn) ? " mismatch" : "");
  } else { $("overlay").innerHTML = "overlay –"; $("overlay").className = "kv"; }
  $("k1").textContent = has(pn) ? "correct" : "correct: no readable number";
  $("k2").textContent = has(pn) ? "wrong number (type it)" : "readable: type the number";
  renderFlags();
  const pv = $("prev");
  if (v) { pv.style.display = "block"; pv.textContent = "current verdict: " + v.verdict + (has(v.number) ? " #" + v.number : "") + (v.boxes_wrong ? " · boxes wrong" : ""); }
  else pv.style.display = "none";
  const ctx = $("ctx"); ctx.innerHTML = "";
  if (it.car_box_context) {
    const im = new Image(); im.src = imgurl(it.car_box_context); im.onclick = () => zoom(im.src, null); ctx.appendChild(im);
  }
  const meta = it.meta || {}, parts = [];
  for (const [k, x] of Object.entries(meta)) if (x === null || typeof x !== "object") parts.push(`${k} <b>${x}</b>`);
  $("meta").innerHTML = parts.join(" · ");

  const g = $("grid"); g.innerHTML = "";
  const crops = (it.crops || []).slice(0, 12), nb = it.number_boxes || [], reads = it.crop_reads || [];
  crops.forEach((c, j) => {
    const cell = document.createElement("div"); cell.className = "cell";
    const w = boxedImage(imgurl(c), nb[j]); w.onclick = () => zoom(imgurl(c), nb[j]);
    cell.appendChild(w);
    if (has(reads[j])) {
      const r = document.createElement("span"); r.className = "read " + readClass(reads[j], pn);
      r.textContent = reads[j]; r.style.display = showReads ? "" : "none"; cell.appendChild(r);
    }
    g.appendChild(cell);
  });
  layoutGrid();
  shownAt = performance.now();
  prefetch(i);
}

function prefetch(i) {
  let k = 0;
  for (let j = i + 1; j < items.length && k < 2; j++) {
    if (verdicts[items[j].item_id]) continue;
    for (const c of items[j].crops || []) { const im = new Image(); im.src = imgurl(c); }
    k++;
  }
}

function renderFlags() {
  const it = items[cur], f = $("flags"); f.innerHTML = "";
  const add = (t, on, title) => { const s = document.createElement("span"); s.className = "flag" + (on ? " on" : ""); s.textContent = t; if (title) s.title = title; f.appendChild(s); };
  if ((it.number_boxes || []).some(b => b && b.length) || boxesWrong) add("number boxes wrong [B]", boxesWrong);
  else add("no number boxes", false);
}

function showDone() {
  $("grid").style.display = "none";
  const s = stats(), p = wilson(s.c, s.c + s.w), d = $("done");
  d.style.display = "block";
  d.innerHTML = `All ${items.length} items reviewed.<br>precision ${p ? pct(p[0]) + "% [" + pct(p[1]) + "–" + pct(p[2]) + "]" : "–"}` +
    ` · not a car ${s.nc} · unsure ${s.un}<br>Full report: <code>python tools/qa/report.py &lt;batch file&gt;</code><br>` +
    `<span class="kv">Backspace re-opens the last item.</span>`;
  $("side").style.display = "none";
}

function flash(color) {
  const f = $("flash"); f.style.transition = "none"; f.style.borderColor = color;
  requestAnimationFrame(() => { f.style.transition = "border-color .35s"; f.style.borderColor = "transparent"; });
}
function msg(t) { const m = $("msg"); m.textContent = t; m.style.display = t ? "block" : "none"; }

function post(rec) { queue.push(rec); pump(); }
async function pump() {
  if (sending || !queue.length) return;
  sending = true;
  const rec = queue[0];
  try {
    const r = await fetch("/api/verdict", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(rec)});
    const j = await r.json();
    if (!r.ok || !j.ok) throw new Error(j.error || r.status);
    queue.shift(); msg(queue.length ? `saving… (${queue.length} queued)` : "");
  } catch (e) {
    msg("NOT SAVED (" + e.message + "), retrying… keep this tab open");
    sending = false; setTimeout(pump, 2000); return;
  }
  sending = false; pump();
}

function verdict(v, number) {
  if (cur < 0) return;
  const it = items[cur];
  const rec = {item_id: it.item_id, verdict: v, number: v === "wrong" && has(number) ? Number(number) : null,
               boxes_wrong: boxesWrong, dt_ms: Math.round(performance.now() - shownAt)};
  verdicts[it.item_id] = rec;
  history = history.filter(x => x !== it.item_id); history.push(it.item_id);
  post(rec);
  flash({correct: "var(--ok)", wrong: "var(--bad)", not_car: "var(--warn)", unsure: "var(--dim)"}[v]);
  renderHeader();
  showItem(nextUnreviewed(cur + 1));
}

function undo() {
  const id = history.pop();
  if (!id) { msg("nothing to undo"); setTimeout(() => msg(""), 1200); return; }
  delete verdicts[id];
  post({item_id: id, verdict: "undo"});
  renderHeader();
  showItem(items.findIndex(x => x.item_id === id));
}

function setWrongMode(on) {
  wrongMode = on;
  $("wrongbox").style.display = on ? "block" : "none";
  const inp = $("wrongnum");
  if (on) { inp.value = ""; $("wrongteam").textContent = ""; inp.focus(); } else inp.blur();
}

$("wrongnum").addEventListener("input", e => {
  const v = e.target.value.replace(/\D/g, ""); e.target.value = v;
  const it = items[cur]; const t = team(it.event, v);
  $("wrongteam").textContent = v ? (t || "not in roster") : "";
  $("wrongteam").style.color = v && !t ? "var(--bad)" : "";
});

document.addEventListener("keydown", e => {
  if (!B) return;
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  if (wrongMode) {
    if (e.key === "Enter") { e.preventDefault(); const v = $("wrongnum").value; setWrongMode(false); verdict("wrong", v); }
    else if (e.key === "Escape") { e.preventDefault(); setWrongMode(false); }
    return;   // typing goes to the input
  }
  if (e.repeat) return;
  if ($("zoom").style.display === "flex" && (e.key === "Escape" || e.key === " ")) { e.preventDefault(); unzoom(); return; }
  switch (e.key) {
    case "1": unzoom(); verdict("correct"); break;
    case "2": unzoom(); if (cur >= 0) setWrongMode(true); e.preventDefault(); break;
    case "3": unzoom(); verdict("not_car"); break;
    case "4": unzoom(); verdict("unsure"); break;
    case "b": case "B": if (cur >= 0) { boxesWrong = !boxesWrong; renderFlags(); } break;
    case "r": case "R": showReads = !showReads; for (const r of document.querySelectorAll(".read")) r.style.display = showReads ? "" : "none"; break;
    case "Backspace": e.preventDefault(); unzoom(); undo(); break;
    case "Escape": unzoom(); break;
  }
});
// touch / mouse: the footer key hints act as buttons (same path as the keyboard)
for (const s of document.querySelectorAll("#keys [data-k]"))
  s.addEventListener("click", () => document.dispatchEvent(new KeyboardEvent("keydown", {key: s.dataset.k})));
$("zoom").addEventListener("click", unzoom);
window.addEventListener("resize", layoutGrid);
window.addEventListener("beforeunload", e => { if (queue.length) { e.preventDefault(); e.returnValue = ""; } });

(async function init() {
  const r = await fetch("/api/batch"); B = await r.json();
  items = B.items; verdicts = B.verdicts || {};
  history = Object.values(verdicts).sort((a, b) => String(a.ts).localeCompare(String(b.ts))).map(v => v.item_id);
  $("bname").textContent = B.name + (B.reviewer ? " · " + B.reviewer : "");
  document.title = "QA · " + B.name;
  renderHeader();
  showItem(nextUnreviewed(0));
})();
</script>
</body>
</html>
